spring.application.name=OperatorApi
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/agri-fleet-analytics-db
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# REQ-API-COMMON: still Spring's default error body, but with the ResponseStatusException message
# in it — otherwise the four different 400 reasons of REQ-API-HISTORY are indistinguishable.
spring.web.error.include-message=always
