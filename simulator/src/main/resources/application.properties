spring.application.name=Simulator
spring.main.web-application-type=none

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

# Hours of telemetry published as a burst at startup; 0 disables the burst.
# A full window is what makes the REQ-SIM-DEMO outcomes visible on the first screen.
# See REQ-SIM-BURST.
simulator.backfill.hours=24
