spring.application.name=Simulator
spring.main.web-application-type=none

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

# Hours of telemetry published as a burst at startup; 0 disables the burst.
# Calibrated, not arbitrary. With the per-asset SPEC §3.2 rates the rolling counters no
# longer saturate, so a full window is the right burst: BALER's highLoadHours does not
# reach its MODERATE bar until about 20 h of window, and below that every machine except
# TRACTOR reads GOOD and the fleet looks uniform again. See IMPLEMENTATION-PLAN.md §1.6.
simulator.backfill.hours=24
